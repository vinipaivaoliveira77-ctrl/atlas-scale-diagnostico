<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Diagnóstico - Atlas Scale</title>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7E3BEC;
      --primary-light: #AB78FF;
      --dark: #000000;
      --surface: #0C0C0C;
      --surface-hover: #141414;
      --text-primary: #F5F5F5;
      --text-secondary: rgba(245, 245, 245, 0.6);
      --border: rgba(245, 245, 245, 0.1);
      --teal: #2A8B7A;
      --amber: #D4850A;
      --cyan: #2A7AC4;
      --rose: #C4407A;
    }

    body {
      background: linear-gradient(135deg, var(--dark) 0%, #0a0a0a 100%);
      color: var(--text-primary);
      font-family: 'Alexandria', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Efeito de fundo sutil */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(126, 59, 236, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(42, 139, 122, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 2rem;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeIn 0.6s ease-out;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    /* Score Section */
    .score-section {
      background: linear-gradient(135deg, rgba(126, 59, 236, 0.1) 0%, rgba(42, 139, 122, 0.05) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem;
      margin-bottom: 3rem;
      text-align: center;
      backdrop-filter: blur(10px);
      animation: slideUp 0.7s ease-out 0.1s both;
    }

    .score-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1rem;
    }

    .score-number {
      font-size: 5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      line-height: 1;
    }

    .score-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .score-description {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Areas Grid */
    .areas-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 3rem;
      animation: slideUp 0.7s ease-out 0.2s both;
    }

    .area-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .area-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .area-card:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }

    .area-card:hover::before {
      opacity: 1;
    }

    .area-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .area-name {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.8rem;
    }

    .area-score {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .area-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .area-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 2px;
      transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s;
    }

    /* Diagnóstico Section */
    .diagnostico-section {
      margin-bottom: 3rem;
      animation: slideUp 0.7s ease-out 0.3s both;
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 2rem;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), transparent);
      border-radius: 2px;
    }

    .diagnostico-item {
      background: var(--surface);
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }

    .diagnostico-item:hover {
      background: var(--surface-hover);
      transform: translateX(4px);
    }

    .diagnostico-item h3 {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .diagnostico-item p {
      color: var(--text-secondary);
      margin-bottom: 0.8rem;
      line-height: 1.7;
    }

    .diagnostico-item p:last-child {
      margin-bottom: 0;
    }

    .insight {
      background: rgba(126, 59, 236, 0.08);
      border-left: 3px solid var(--primary);
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    /* Copy Section */
    .copy-section {
      background: linear-gradient(135deg, rgba(126, 59, 236, 0.12) 0%, rgba(42, 139, 122, 0.06) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      animation: slideUp 0.7s ease-out 0.4s both;
    }

    .copy-section h2 {
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
      color: var(--primary-light);
    }

    .copy-section p {
      margin-bottom: 1rem;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .copy-section ul {
      list-style: none;
      margin: 1.5rem 0;
    }

    .copy-section li {
      padding-left: 1.8rem;
      margin-bottom: 0.8rem;
      position: relative;
      color: var(--text-secondary);
    }

    .copy-section li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: 600;
    }

    .social-proof {
      background: rgba(126, 59, 236, 0.15);
      border-radius: 10px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      border-left: 3px solid var(--primary);
    }

    .social-proof strong {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--primary-light);
    }

    /* CTA Button */
    .cta-container {
      text-align: center;
      animation: slideUp 0.7s ease-out 0.5s both;
    }

    .whatsapp-btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 1.2rem 2.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(126, 59, 236, 0.25);
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(126, 59, 236, 0.35);
    }

    .whatsapp-btn:active {
      transform: translateY(0);
    }

    .cta-subtitle {
      color: var(--text-secondary);
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
      }

      .score-number {
        font-size: 3.5rem;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .areas-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .diagnostico-item {
        padding: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem 1rem;
        max-width: 100%;
      }

      .header {
        margin-bottom: 1.5rem;
      }

      .header h1 {
        font-size: 1.4rem;
        margin-bottom: 0.8rem;
      }

      .header p {
        font-size: 0.85rem;
      }

      .score-container {
        padding: 1.5rem 1rem;
        margin-bottom: 1.5rem;
      }

      .score-number {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }

      .score-label {
        font-size: 0.85rem;
      }

      .areas-label {
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      .areas-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .diagnostico-item {
        padding: 1rem;
        border-radius: 4px;
      }

      .diagnostico-label {
        font-size: 0.8rem;
      }

      .diagnostico-title {
        font-size: 0.95rem;
        margin: 0.5rem 0;
      }

      .diagnostico-text {
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .cta-section {
        padding: 1.5rem 1rem;
        text-align: center;
      }

      .cta-section h2 {
        font-size: 1.3rem;
        margin-bottom: 0.8rem;
      }

      .cta-section p {
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }

      .cta-button {
        padding: 0.85rem 1.5rem;
        font-size: 0.9rem;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Diagnóstico Detalhado -->

        Mesmo que não envie mensagem agora, entraremos em contato com você em breve.
      </p>
    </div>
  </div>

    function getScoreLevel(score) {
      if (score <= 30) return 'Crítico';
      if (score <= 60) return 'Baixo';
      if (score <= 80) return 'Intermediário';
      return 'Ótimo';
    }

    function getLevelDescription(score) {
      if (score <= 30) return 'Sua agência está deixando muito dinheiro na mesa.';
      if (score <= 60) return 'Sua agência está entregando, mas há espaço para melhorias significativas.';
      if (score <= 80) return 'Sua agência está entregando em alguns pontos, mas há bastante espaço para melhorias.';
      return 'Sua agência está entregendo bem. Continue monitorando, mas você está em bom caminho.';
    }
